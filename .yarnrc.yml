nodeLinker: node-modules

enableTelemetry: false

# Resolve only package versions published at least 7 days ago, so a malicious or
# broken release has time to be caught. First-party Midnight packages are
# exempt: coordinated version passes move to them as soon as they ship.
npmMinimalAgeGate: "7d"
npmPreapprovedPackages:
  - "@midnight-ntwrk/*"
  - "@midnightntwrk/*"
