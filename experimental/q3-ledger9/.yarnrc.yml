nodeLinker: node-modules

enableTelemetry: false

# The Q3 release candidates were published hours before this workspace was
# built, so Yarn's default 24 h minimum-age gate quarantines them. Exempt only
# the two first-party Midnight scopes; every third-party package keeps the gate.
npmPreapprovedPackages:
  - "@midnight-ntwrk/*"
  - "@midnightntwrk/*"
