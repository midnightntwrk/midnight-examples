nodeLinker: node-modules

enableTelemetry: false

# Third-party packages must be at least 7 days old. The Q3 release candidates
# were published hours before this workspace was built, so exempt only the two
# first-party Midnight scopes; every third-party package keeps the gate.
npmMinimalAgeGate: "7d"
npmPreapprovedPackages:
  - "@midnight-ntwrk/*"
  - "@midnightntwrk/*"
