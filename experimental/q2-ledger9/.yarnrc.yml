approvedGitRepositories:
  - "**"

enableScripts: true

enableTelemetry: false

nodeLinker: node-modules

# Third-party packages must be at least 7 days old; the first-party Midnight
# scopes are exempt, as in q3-ledger9.
npmMinimalAgeGate: "7d"
npmPreapprovedPackages:
  - "@midnight-ntwrk/*"
  - "@midnightntwrk/*"
