name: mnkit publish rehearsal

# Run by hand before a release: publishes mnkit and the runtime packages to a
# throwaway Verdaccio registry inside the job, then scaffolds and tests a
# project with `npx mnkit@<version>` from it, so npx resolution and the
# `^<version>` ranges mnkit writes are exercised as they will be on npm.
# Nothing leaves the runner. See scripts/mnkit-rehearsal.sh.

# Lock down top-level permissions. Grant per-job.
permissions: {}

on:
  workflow_dispatch:
    inputs:
      devnet:
        description: 'Also run validate (local network and devnet tests)'
        type: boolean
        default: true

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          persist-credentials: false

      - name: Setup Compact Compiler
        uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8
        with:
          compact-version: '0.31.1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  #v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies (builds the runtime packages)
        run: yarn install --immutable

      - name: Publish to a local registry, then init and test from it
        run: bash scripts/mnkit-rehearsal.sh ${{ inputs.devnet && '--devnet' || '' }}
        env:
          MNKIT_E2E_DIR: ${{ runner.temp }}/mnkit-rehearsal
