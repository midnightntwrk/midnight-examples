name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group:
    ${{ github.event_name != 'merge_group' && format('{0}-{1}', github.workflow, github.head_ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  # One job per example: compile the contract AND run its test suite against a
  # fresh local Midnight network. "Compilation is not correctness" — every
  # example must compile and run on each toolchain release.
  example:
    name: ${{ matrix.example }}
    runs-on: ubuntu-latest
    # The slowest suite (shielded-chips) takes about 20 minutes; the rest under 10.
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        example: [hello-world, private-party, battleship, calculator, token-transfers, silent-auction, election, secret-message, zk-loan, shielded-chips, private-bid, private-tip-jar]
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  #v6.0.2
        with:
          persist-credentials: false

      - name: Setup Compact Compiler
        uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8
        with:
          compact-version: '0.31.1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  #v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack (Yarn 4)
        working-directory: .
        run: corepack enable

      - name: Install dependencies (whole workspace)
        working-directory: .
        run: yarn install --immutable

      - name: Compile contract
        run: yarn compile

      # Seconds, and its errors are clearer than the same mistake surfacing
      # inside a devnet test run.
      - name: Typecheck harness and tests
        run: yarn typecheck

      # In-memory contract tests (src/**/*.sim.test.ts): no Docker, seconds.
      # Logic errors fail here before the network is started.
      - name: Run in-memory contract tests
        run: yarn test:sim

      # SPEC.md against the compiled contract and the sim tests (examples with
      # a design card only).
      - name: Lint SPEC.md
        run: if [ -f SPEC.md ]; then node ../../scripts/spec-lint.mjs ${{ matrix.example }}; fi

      - name: Start local Midnight network
        run: yarn env:up

      - name: Wait for DUST to accrue
        run: yarn wait:dust

      - name: Run tests against local network
        run: yarn test:local

      # Must run before env:down, which removes the containers and their logs.
      - name: Collect service logs on failure
        if: failure()
        run: mkdir -p logs && docker compose logs --no-color --timestamps > logs/compose.log 2>&1 || true

      - name: Stop local Midnight network
        if: always()
        run: yarn env:down

      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  #v7.0.1
        with:
          name: docker-compose-logs-${{ matrix.example }}
          path: examples/${{ matrix.example }}/logs/
          if-no-files-found: ignore
          retention-days: 7

  # Every UI scaffolded by `yarn new:ui` (marked by its ui/new-ui.json, the same
  # marker `yarn new:ui --check-all` uses):
  # its template-owned files must match templates/ui, and it must typecheck,
  # pass its unit tests and build (Vite/Rollup bundling problems only show up
  # there). No local network needed. The wallet flow needs a
  # human (Lace approvals), so there is no E2E step.
  ui:
    name: generated UIs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  #v6.0.2
        with:
          persist-credentials: false

      - name: Setup Compact Compiler
        uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8
        with:
          compact-version: '0.31.1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  #v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies (whole workspace)
        run: yarn install --immutable

      - name: Check, typecheck, unit-test, and build each generated UI
        run: |
          set -euo pipefail
          found=0
          for f in examples/*/ui/new-ui.json; do
            [ -f "$f" ] || continue
            name=$(basename "$(dirname "$(dirname "$f")")")
            found=1
            echo "::group::$name/ui"
            yarn workspace "@midnight-ntwrk/example-$name" run compile
            yarn new:ui "$name" --check
            yarn workspace "@midnight-ntwrk/example-$name-ui" typecheck
            yarn workspace "@midnight-ntwrk/example-$name-ui" test:unit
            yarn workspace "@midnight-ntwrk/example-$name-ui" build
            echo "::endgroup::"
          done
          [ "$found" = 1 ] || { echo "no generated UIs found"; exit 1; }

  # The scaffolding itself: packages/sim's own tests (including the negative
  # control for assertNotInPublicState), and a throwaway example taken through
  # new:example → compile:fast → --derive twice. The second --derive must
  # change nothing, and the derived stubs must type-check.
  scaffold:
    name: scaffold and sim harness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  #v6.0.2
        with:
          persist-credentials: false

      - name: Setup Compact Compiler
        uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8
        with:
          compact-version: '0.31.1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  #v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies (whole workspace)
        run: yarn install --immutable

      - name: Typecheck and test packages/sim and packages/coins
        run: |
          yarn workspace @midnight-ntwrk/example-sim typecheck
          yarn workspace @midnight-ntwrk/example-sim test:sim
          yarn workspace @midnight-ntwrk/example-coins typecheck
          yarn workspace @midnight-ntwrk/example-coins test:sim

      - name: Scaffold, compile:fast and derive a throwaway example
        run: |
          set -euo pipefail
          yarn new:example ci-derive --witnesses --no-register
          # A contract with a constructor argument, a witness, a pure circuit, a Map
          # and a shielded-coin argument, plus a second, witness-less contract that
          # mints: compile:fast compiles both, and --derive wires the second one.
          cp examples/private-tip-jar/contract/private-tip-jar.compact examples/ci-derive/contract/ci-derive.compact
          cp examples/private-tip-jar/contract/tip-token.compact examples/ci-derive/contract/tip-token.compact
          yarn install --no-immutable
          yarn workspace @midnight-ntwrk/example-ci-derive compile:fast
          yarn new:example ci-derive --derive
          grep -q 'CompiledTipTokenContract = CompiledContract.make' examples/ci-derive/contract/index.ts
          grep -q "it('deploys tip-token'" examples/ci-derive/src/test/ci-derive.test.ts
          grep -q "from '@midnight-ntwrk/example-coins'" examples/ci-derive/src/test/ci-derive.sim.test.ts
          cp -r examples/ci-derive "$RUNNER_TEMP/first"
          yarn new:example ci-derive --derive
          diff -r --exclude=node_modules --exclude=managed "$RUNNER_TEMP/first" examples/ci-derive
          yarn workspace @midnight-ntwrk/example-ci-derive typecheck

      - name: Pipeline runner and SPEC lint
        run: |
          set -euo pipefail
          # The runner stops at step 1 on a scaffold whose SPEC.md is still the template.
          step=$(yarn pipeline ci-derive --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).next.step))' || true)
          test "$step" = "1"
          # new:ui refuses an example that hasn't passed the in-memory gate.
          if node scripts/new-ui.mjs ci-derive > "$RUNNER_TEMP/new-ui.log" 2>&1; then exit 1; fi
          grep -q 'in-memory gate' "$RUNNER_TEMP/new-ui.log"
          # The in-memory gate end to end on a real example: spec lint, compile:fast,
          # derive, typecheck, test:sim and the SPEC code checks. (Each example's
          # SPEC.md is also linted in its matrix job.)
          yarn pipeline private-tip-jar --until sim
