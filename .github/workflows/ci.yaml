name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Every job is guarded to this repo: midnight-examples-mirror (private, kept
# in sync by mirror.yml) receives this file too, and is for review and
# scanning, not a second copy of these devnet runs on billed minutes.

concurrency:
  group:
    ${{ github.event_name != 'merge_group' && format('{0}-{1}', github.workflow, github.head_ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  # Which of the heavy jobs below a change can affect (scripts/ci-changes.mjs
  # has the path rules). On a PR, an example job, the ui job and the mnkit-e2e
  # jobs with nothing to check skip their steps and pass in seconds, so every
  # check name still appears. Pushes to main and manual runs check everything.
  changes:
    name: changes
    if: github.repository == 'midnightntwrk/midnight-examples'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      examples: ${{ steps.plan.outputs.examples }}
      ui: ${{ steps.plan.outputs.ui }}
      mnkit: ${{ steps.plan.outputs.mnkit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          persist-credentials: false
          # A PR checks out its merge commit, whose first parent is the base tip.
          fetch-depth: 2

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  #v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Work out what to check
        id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            json=$(node scripts/ci-changes.mjs 'HEAD^1')
          else
            json=$(node scripts/ci-changes.mjs --all)
          fi
          echo "$json"
          node -e '
            const r = JSON.parse(process.argv[1]);
            console.log(`examples=${JSON.stringify(r.examples)}\nui=${r.ui}\nmnkit=${r.mnkit}`);
          ' "$json" >> "$GITHUB_OUTPUT"

  # One job per example: compile the contract AND run its test suite against a
  # fresh local Midnight network. "Compilation is not correctness" — every
  # example must compile and run on each toolchain release.
  example:
    name: ${{ matrix.example }}
    if: github.repository == 'midnightntwrk/midnight-examples'
    runs-on: ubuntu-latest
    # The slowest suite (shielded-chips) takes about 20 minutes; the rest under 10.
    timeout-minutes: 45
    needs: changes
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        example: [hello-world, private-party, battleship, calculator, token-transfers, silent-auction, election, secret-message, zk-loan, shielded-chips, private-bid, private-tip-jar]
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    env:
      RUN: ${{ contains(fromJSON(needs.changes.outputs.examples), matrix.example) }}
    steps:
      - name: Nothing to check
        if: env.RUN != 'true'
        # No checkout on this path, so examples/<name> doesn't exist.
        working-directory: .
        run: echo "No change in this PR affects ${{ matrix.example }}; skipped (see scripts/ci-changes.mjs)."

      - name: Checkout code
        if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          persist-credentials: false

      - name: Setup Compact Compiler
        if: env.RUN == 'true'
        uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8
        with:
          compact-version: '0.36.0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Node.js
        if: env.RUN == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  #v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Use the pinned npm (min-release-age in .npmrc needs 11.10+)
        if: env.RUN == 'true'
        working-directory: .
        run: npm install -g npm@11.21.0

      - name: Install dependencies (whole workspace)
        if: env.RUN == 'true'
        working-directory: .
        run: npm ci

      - name: Compile contract
        if: env.RUN == 'true'
        run: npm run compile

      # Seconds, and its errors are clearer than the same mistake surfacing
      # inside a devnet test run.
      - name: Typecheck harness and tests
        if: env.RUN == 'true'
        run: npm run typecheck

      # In-memory contract tests (src/**/*.sim.test.ts): no Docker, seconds.
      # Logic errors fail here before the network is started.
      - name: Run in-memory contract tests
        if: env.RUN == 'true'
        run: npm run test:sim

      # SPEC.md against the compiled contract and the sim tests (examples with
      # a design card only).
      - name: Lint SPEC.md
        if: env.RUN == 'true'
        run: if [ -f SPEC.md ]; then node ../../scripts/spec-lint.mjs ${{ matrix.example }}; fi

      - name: Start local Midnight network
        if: env.RUN == 'true'
        run: npm run env:up

      - name: Wait for DUST to accrue
        if: env.RUN == 'true'
        run: npm run wait:dust

      - name: Run tests against local network
        if: env.RUN == 'true'
        run: npm run test:local

      # Must run before env:down, which removes the containers and their logs.
      - name: Collect service logs on failure
        if: failure() && env.RUN == 'true'
        run: mkdir -p logs && docker compose logs --no-color --timestamps > logs/compose.log 2>&1 || true

      - name: Stop local Midnight network
        if: always() && env.RUN == 'true'
        run: npm run env:down

      - name: Upload service logs on failure
        if: failure() && env.RUN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  #v7.0.2
        with:
          name: docker-compose-logs-${{ matrix.example }}
          path: examples/${{ matrix.example }}/logs/
          if-no-files-found: ignore
          retention-days: 7

  # Every UI scaffolded by `npm run new:ui` (marked by its ui/new-ui.json, the same
  # marker `npm run new:ui -- --check-all` uses):
  # its template-owned files must match packages/mnkit/templates/ui, and it must typecheck,
  # pass its unit tests and build (Vite/Rollup bundling problems only show up
  # there). No local network needed. The wallet flow needs a
  # human (Lace approvals), so there is no E2E step.
  ui:
    name: generated UIs
    if: github.repository == 'midnightntwrk/midnight-examples'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    permissions:
      contents: read
    env:
      RUN: ${{ needs.changes.outputs.ui }}
    steps:
      - name: Nothing to check
        if: env.RUN != 'true'
        run: echo "No change in this PR affects the generated UIs; skipped (see scripts/ci-changes.mjs)."

      - name: Checkout code
        if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          persist-credentials: false

      - name: Setup Compact Compiler
        if: env.RUN == 'true'
        uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8
        with:
          compact-version: '0.36.0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Node.js
        if: env.RUN == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  #v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Use the pinned npm (min-release-age in .npmrc needs 11.10+)
        if: env.RUN == 'true'
        run: npm install -g npm@11.21.0

      - name: Install dependencies (whole workspace)
        if: env.RUN == 'true'
        run: npm ci

      - name: Check, typecheck, unit-test, and build each generated UI
        if: env.RUN == 'true'
        run: |
          set -euo pipefail
          found=0
          for f in examples/*/ui/new-ui.json; do
            [ -f "$f" ] || continue
            name=$(basename "$(dirname "$(dirname "$f")")")
            found=1
            echo "::group::$name/ui"
            npm run compile -w "@midnight-ntwrk/example-$name"
            npm run new:ui -- "$name" --check
            npm run typecheck -w "@midnight-ntwrk/example-$name-ui"
            npm run test:unit -w "@midnight-ntwrk/example-$name-ui"
            npm run build -w "@midnight-ntwrk/example-$name-ui"
            echo "::endgroup::"
          done
          [ "$found" = 1 ] || { echo "no generated UIs found"; exit 1; }

  # Tutorial conventions (docs/tutorials.md): every tutorials/ folder has an
  # index.mdx, and no tutorial sends readers to a standalone example-* repo
  # (those repos are being archived; tutorials use this repo's commands).
  tutorials:
    name: tutorial conventions
    if: github.repository == 'midnightntwrk/midnight-examples'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          persist-credentials: false

      - name: Check tutorials
        run: |
          set -euo pipefail
          shopt -s nullglob
          dirs=(examples/*/tutorials packages/mnkit/templates/example/tutorials)
          status=0
          for dir in "${dirs[@]}"; do
            if [ ! -f "$dir/index.mdx" ]; then
              echo "::error file=$dir::$dir has no index.mdx"
              status=1
            fi
          done
          if [ "${#dirs[@]}" -gt 0 ] && grep -rnE 'git clone.*example-[a-z]|midnightntwrk/example-[a-z]' "${dirs[@]}"; then
            echo "::error::A tutorial points at a standalone example-* repo. Use this repo's commands and links (see docs/tutorials.md)."
            status=1
          fi
          # Titled code blocks must quote their file verbatim.
          node scripts/check-tutorial-code.mjs || status=1
          exit "$status"

  # The scaffolding itself: packages/sim's own tests (including the negative
  # control for assertNotInPublicState), and a throwaway example taken through
  # new:example → compile:fast → --derive twice. The second --derive must
  # change nothing, and the derived stubs must type-check.
  scaffold:
    name: scaffold and sim harness
    if: github.repository == 'midnightntwrk/midnight-examples'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          persist-credentials: false

      # Examples are copied out of the repo and into the docs, so they may only
      # use published @midnight-ntwrk packages. mnkit's runtime packages are
      # for standalone projects; an example carries its own copies instead
      # (src/wallet.ts, src/test/sim.ts, src/test/coins.ts).
      - name: Examples don't use mnkit's runtime packages
        run: |
          if git grep -n '@midnightntwrk/mnkit-' -- examples; then
            echo "::error::examples/ must not name @midnightntwrk/mnkit-* (see AGENTS.md)."
            exit 1
          fi

      - name: Setup Compact Compiler
        uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8
        with:
          compact-version: '0.36.0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  #v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Use the pinned npm (min-release-age in .npmrc needs 11.10+)
        run: npm install -g npm@11.21.0

      - name: Install dependencies (whole workspace)
        run: npm ci

      - name: Toolchain pins agree with toolchain.json
        run: npm run toolchain:check

      - name: Engine unit tests (scripts/lib)
        run: npm run test:engine

      - name: Compiled test fixtures match the pinned compiler
        run: npm run fixtures:regen -- --check

      - name: Typecheck and test the runtime packages (built by postinstall)
        run: |
          npm run typecheck -w @midnightntwrk/mnkit-wallet
          npm run test:sim -w @midnightntwrk/mnkit-wallet
          npm run typecheck -w @midnightntwrk/mnkit-sim
          npm run test:sim -w @midnightntwrk/mnkit-sim
          npm run typecheck -w @midnightntwrk/mnkit-coins
          npm run test:sim -w @midnightntwrk/mnkit-coins

      - name: Scaffold, compile:fast and derive a throwaway example
        run: |
          set -euo pipefail
          npm run new:example -- ci-derive --witnesses --no-register
          # A contract with a constructor argument, a witness, a pure circuit, a Map
          # and a shielded-coin argument, plus a second, witness-less contract that
          # mints: compile:fast compiles both, and --derive wires the second one.
          cp examples/private-tip-jar/contract/private-tip-jar.compact examples/ci-derive/contract/ci-derive.compact
          cp examples/private-tip-jar/contract/tip-token.compact examples/ci-derive/contract/tip-token.compact
          npm install
          npm run compile:fast -w @midnight-ntwrk/example-ci-derive
          npm run new:example -- ci-derive --derive
          grep -q 'CompiledTipTokenContract = CompiledContract.make' examples/ci-derive/contract/index.ts
          grep -q "it('deploys tip-token'" examples/ci-derive/src/test/ci-derive.test.ts
          grep -q "from './coins.js'" examples/ci-derive/src/test/ci-derive.sim.test.ts
          cp -r examples/ci-derive "$RUNNER_TEMP/first"
          npm run new:example -- ci-derive --derive
          diff -r --exclude=node_modules --exclude=managed "$RUNNER_TEMP/first" examples/ci-derive
          npm run typecheck -w @midnight-ntwrk/example-ci-derive

      - name: Pipeline runner and SPEC lint
        run: |
          set -euo pipefail
          # The runner stops at step 1 on a scaffold whose SPEC.md is still the template.
          step=$(npm run -s pipeline -- ci-derive --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).next.step))' || true)
          test "$step" = "1"
          # new:ui refuses an example that hasn't passed the in-memory gate.
          if node scripts/new-ui.mjs ci-derive > "$RUNNER_TEMP/new-ui.log" 2>&1; then exit 1; fi
          grep -q 'in-memory gate' "$RUNNER_TEMP/new-ui.log"
          # The in-memory gate end to end on a real example: spec lint, compile:fast,
          # derive, typecheck, test:sim and the SPEC code checks. (Each example's
          # SPEC.md is also linted in its matrix job.)
          npm run pipeline -- private-tip-jar --until sim

  # mnkit as a user gets it: pack mnkit and the runtime packages, scaffold each
  # fixture with the packed CLI outside the workspace, derive (twice, no diff),
  # typecheck, test:sim, then validate on a local network. Nothing comes from
  # npm except third-party dependencies. See scripts/mnkit-e2e.sh.
  mnkit-e2e:
    name: mnkit e2e (${{ matrix.fixture }}${{ matrix.upgrade && ', upgrade' || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        fixture: [hello-world, private-tip-jar]
        upgrade: [false]
        # hello-world also compiles once on a machine without Compact, so
        # `mnkit compile` installs the CLI and compiler (--fresh-compact).
        # The upgrade test (scaffold with the previous mnkit, then `mnkit
        # upgrade` to this one: scripts/mnkit-e2e.sh --upgrade-from) is off:
        # every earlier mnkit is on Ledger 8 and was never published, and 0.2.0
        # ships on Ledger 9 with no Ledger 8 upgrade path.
        # TODO(mnkit 0.2.0 on npm): add back
        #   include: [{ fixture: private-tip-jar, upgrade: true }]
        # with MNKIT_UPGRADE_FROM set to 0.2.0, then to the previous release.
        # Then delete the Yarn install branch in scripts/mnkit-e2e.sh.
    env:
      RUN: ${{ needs.changes.outputs.mnkit }}
      MNKIT_UPGRADE_FROM: ''
    steps:
      - name: Nothing to check
        if: env.RUN != 'true'
        run: echo "No change in this PR affects mnkit; skipped (see scripts/ci-changes.mjs)."

      - name: Checkout code
        if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          persist-credentials: false
          # The upgrade test packs the old mnkit from a worktree at that commit.
          fetch-depth: ${{ matrix.upgrade && '0' || '1' }}

      - name: Setup Compact Compiler
        if: env.RUN == 'true'
        uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8
        with:
          compact-version: '0.36.0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Node.js
        if: env.RUN == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  #v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies (whole workspace; builds the runtime packages)
        if: env.RUN == 'true'
        # npm 11 for the repo (its lockfile and .npmrc need 11.10+), through npx: Node's own npm
        # stays on PATH, and mnkit-e2e.sh runs the scaffolded projects with it, as users do.
        run: npx --yes npm@11.21.0 ci

      - name: Pack, scaffold, derive, test:sim, add ui and validate on a local network
        if: env.RUN == 'true'
        run: bash scripts/mnkit-e2e.sh --devnet ${FRESH:+--fresh-compact} ${UPGRADE:+--upgrade-from "$MNKIT_UPGRADE_FROM"} ${{ matrix.fixture }}
        env:
          MNKIT_E2E_DIR: ${{ runner.temp }}/mnkit-e2e
          UPGRADE: ${{ matrix.upgrade && 'true' || '' }}
          FRESH: ${{ matrix.fixture == 'hello-world' && !matrix.upgrade && 'true' || '' }}

      - name: Upload service logs on failure
        if: failure() && env.RUN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  #v7.0.2
        with:
          name: mnkit-e2e-logs-${{ matrix.fixture }}${{ matrix.upgrade && '-upgrade' || '' }}
          path: ${{ runner.temp }}/mnkit-e2e/${{ matrix.fixture }}/logs/
          if-no-files-found: ignore
          retention-days: 7
