services:
  proof-server:
    image: 'midnightntwrk/proof-server:8.1.0'
    command: ['midnight-proof-server', '-v']
    ports:
      - '127.0.0.1:6300:6300'
    environment:
      RUST_BACKTRACE: 'full'
    healthcheck:
      test: ['CMD-SHELL', 'echo > /dev/tcp/127.0.0.1/6300']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  indexer:
    image: 'midnightntwrk/indexer-standalone:4.3.3'
    # Backstop for the node healthcheck below: retry a startup crash instead of
    # failing `docker compose up --wait`.
    restart: on-failure
    ports:
      - '127.0.0.1:8088:8088'
    environment:
      RUST_LOG: 'indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=off,info'
      APP__INFRA__NODE__URL: 'ws://node:9944' # nosemgrep: javascript.lang.security.detect-insecure-websocket.detect-insecure-websocket
      APP__APPLICATION__NETWORK_ID: 'undeployed'
      APP__INFRA__STORAGE__PASSWORD: 'indexer'
      APP__INFRA__PUB_SUB__PASSWORD: 'indexer'
      APP__INFRA__LEDGER_STATE_STORAGE__PASSWORD: 'indexer'
      APP__INFRA__SECRET: '303132333435363738393031323334353637383930313233343536373839303132' # nosemgrep: generic.secrets.security.detected-generic-secret.detected-generic-secret
      APP__INFRA__SPO_NODE__URL: 'ws://node:9944' # nosemgrep: javascript.lang.security.detect-insecure-websocket.detect-insecure-websocket
      APP__INFRA__SPO_NODE__BLOCKFROST_ID: 'e2e-test-dummy-id'
    healthcheck:
      test: ['CMD-SHELL', 'cat /var/run/indexer-standalone/running']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      node:
        condition: service_healthy

  node:
    image: 'midnightntwrk/midnight-node:1.0.0'
    ports:
      - '127.0.0.1:9944:9944'
    # Healthy only once block 1 exists, not just once /health answers. The
    # indexer's SPO indexer exits with "Cannot construct OnlineClientAtBlock:
    # block number 1 not found" if it starts while the chain is at block 0.
    healthcheck:
      test:
        - 'CMD-SHELL'
        - >-
          curl -sf -H 'Content-Type: application/json'
          -d '{"id":1,"jsonrpc":"2.0","method":"chain_getHeader","params":[]}'
          http://localhost:9944 | grep -q '"number":"0x[1-9a-f]'
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    environment:
      CFG_PRESET: 'dev'
      SIDECHAIN_BLOCK_BENEFICIARY: '04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e'
